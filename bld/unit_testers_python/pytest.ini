[pytest]
testpaths = .
python_files = test_sys_*.py test_unit_*.py
markers =
    sys: system test (subprocesses out to build-namelist)
    unit: pure-python unit test (no subprocess)
# --tb=short keeps tracebacks scannable for the large case count.
# --strict-markers errors on typo'd marker names.
addopts = --tb=short --strict-markers
